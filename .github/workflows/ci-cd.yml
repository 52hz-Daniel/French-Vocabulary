name: CI/CD

on:
  pull_request:
  push:
    branches: [master, main]

permissions:
  contents: read

env:
  NODE_VERSION: "22"
  PYTHON_VERSION: "3.12"

jobs:
  test-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install Node dependencies
        run: pnpm install --frozen-lockfile
      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt
      - name: Test
        run: pnpm test
      - name: Production build
        run: pnpm build
      - name: Docker build
        run: docker build --tag tcf-lab:ci .

  deploy:
    if: github.event_name == 'push'
    needs: test-build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Sign in to Azure with OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Build and push immutable image
        env:
          ACR_NAME: ${{ vars.ACR_NAME }}
        run: |
          az acr login --name "$ACR_NAME"
          docker build --tag "$ACR_NAME.azurecr.io/tcf-lab:$GITHUB_SHA" .
          docker push "$ACR_NAME.azurecr.io/tcf-lab:$GITHUB_SHA"
      - name: Deploy Container Apps revision
        env:
          ACR_NAME: ${{ vars.ACR_NAME }}
          RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
          CONTAINER_APP_NAME: ${{ vars.AZURE_CONTAINER_APP_NAME }}
        run: |
          az containerapp update \
            --name "$CONTAINER_APP_NAME" \
            --resource-group "$RESOURCE_GROUP" \
            --image "$ACR_NAME.azurecr.io/tcf-lab:$GITHUB_SHA" \
            --revision-suffix "${GITHUB_SHA:0:8}"
          APP_URL=$(az containerapp show --name "$CONTAINER_APP_NAME" --resource-group "$RESOURCE_GROUP" --query properties.configuration.ingress.fqdn --output tsv)
          curl --fail --retry 12 --retry-delay 10 --retry-all-errors "https://$APP_URL/api/health"
