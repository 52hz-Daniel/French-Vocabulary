<body class="bg-surface-container-low text-on-surface min-h-screen flex flex-col items-center justify-center font-body-md antialiased selection:bg-primary-fixed selection:text-ink-navy">
<!-- 
      Suppressed Global Navigation (SideNavBar & TopAppBar):
      Following the Semantic Shell Mandate, this is a task-focused quiz screen. 
      The global navigation is hidden to prioritize the study canvas and minimize distractions.
    -->
<!-- Main Instrument Canvas -->
<main class="w-full max-w-content-column bg-surface md:border-x border-quiet min-h-screen md:min-h-[800px] flex flex-col relative shadow-sm">
<!-- Header: Minimal context and exit -->
<header class="flex justify-between items-center px-6 py-6 border-b border-quiet">
<button aria-label="Quitter l'exercice" class="text-on-surface-variant hover:text-ink-navy transition-colors focus:outline-none focus:ring-2 focus:ring-ink-navy rounded">
<span class="material-symbols-outlined" data-icon="close">close</span>
</button>
<div class="flex items-center gap-4">
<span class="font-label-caps text-label-caps text-on-surface-variant uppercase tracking-widest">Question 12 / 40</span>
<!-- Progress visual -->
<div class="w-16 h-1 bg-surface-variant rounded-full overflow-hidden">
<div class="w-[30%] h-full bg-ink-navy"></div>
</div>
</div>
<div class="w-6"></div> <!-- Spacer for perfect centering -->
</header>
<!-- Content Area -->
<div class="flex-grow flex flex-col px-6 py-12 md:px-12">
<!-- Section Header -->
<div class="mb-12">
<h2 class="font-label-caps text-label-caps text-on-surface-variant uppercase tracking-widest mb-4">Compréhension Orale</h2>
<div class="h-px w-full bg-quiet"></div>
</div>
<!-- Primary Interaction: Play Word -->
<div class="flex-grow flex flex-col items-center justify-center text-center mb-12">
<button class="group flex flex-col items-center focus:outline-none focus-visible:ring-2 focus-visible:ring-ink-navy rounded-xl p-4 transition-all" id="main-audio-btn">
<!-- Play Ring -->
<div class="play-ring w-24 h-24 rounded-full border border-quiet flex items-center justify-center bg-surface group-hover:bg-paper-cool group-hover:border-ink-navy transition-all duration-300 mb-6">
<span class="material-symbols-outlined text-4xl text-ink-navy" data-icon="play_arrow" style="font-variation-settings: 'FILL' 1;">play_arrow</span>
</div>
<!-- Literary Instruction -->
<h1 class="font-display-fr text-display-fr text-ink-navy mb-4">Écouter le mot</h1>
<!-- Keyboard Shortcut -->
<div class="flex items-center gap-2 opacity-60 group-hover:opacity-100 transition-opacity">
<span class="font-label-caps text-label-caps text-on-surface-variant">Raccourci clavier :</span>
<kbd class="font-label-caps text-label-caps text-ink-navy border border-outline-variant rounded px-2 py-1 bg-surface-bright shadow-[0_1px_0_rgba(0,0,0,0.1)]">Espace</kbd>
</div>
</button>
</div>
<!-- Hint Section (Secondary Audio) -->

<button class="w-full group flex items-center justify-center gap-3 py-4 border-y border-dashed border-outline-variant hover:border-ink-navy hover:bg-paper-cool transition-all text-on-surface-variant hover:text-ink-navy focus:outline-none focus:ring-2 focus:ring-inset focus:ring-ink-navy" id="hint-audio-btn">

<script>
        // Micro-interactions and UI State Logic
        document.addEventListener('DOMContentLoaded', () => {
            const mainAudioBtn = document.getElementById('main-audio-btn');
            const hintAudioBtn = document.getElementById('hint-audio-btn');
            const optionBtns = document.querySelectorAll('.quiz-option-btn');
            
            // Simulate Audio Playing State
            function playAudio(buttonElement, duration = 1500) {
                if (buttonElement.classList.contains('playing-audio')) return;
                
                buttonElement.classList.add('playing-audio');
                const icon = buttonElement.querySelector('.material-symbols-outlined');
                const originalIcon = icon.getAttribute('data-icon');
                
                // Swap icon briefly to show activity
                if(originalIcon === 'play_arrow') {
                    icon.textContent = 'graphic_eq';
                    icon.setAttribute('data-icon', 'graphic_eq');
                }
                
                setTimeout(() => {
                    buttonElement.classList.remove('playing-audio');
                    icon.textContent = originalIcon;
                    icon.setAttribute('data-icon', originalIcon);
                }, duration);
            }

            // Event Listeners for Audio Buttons
            mainAudioBtn.addEventListener('click', () => playAudio(mainAudioBtn, 1200));
            hintAudioBtn.addEventListener('click', () => playAudio(hintAudioBtn, 2500));

            // Global Keyboard Shortcut (Spacebar)
            document.addEventListener('keydown', (e) => {
                // Prevent scrolling if space is pressed, unless focused on an input
                if (e.code === 'Space' && e.target.tagName !== 'INPUT' && e.target.tagName !== 'TEXTAREA') {
                    e.preventDefault(); 
                    playAudio(mainAudioBtn, 1200);
                }
                
                // Number shortcuts for options
                if (['1', '2', '3', '4'].includes(e.key)) {
                    const btn = document.querySelector(`.quiz-option-btn[data-index="${e.key}"]`);
                    if (btn) selectOption(btn);
                }
            });

            // Handle Option Selection (L'Instrument active state)
            function selectOption(selectedBtn) {
                // Reset all
                optionBtns.forEach(btn => {
                    btn.classList.remove('border-l-2', 'border-l-ink-navy', 'bg-paper-cool');
                    btn.classList.add('border-l-0');
                    // Reset icon
                    const icon = btn.querySelector('.material-symbols-outlined');
                    icon.textContent = 'arrow_forward';
                    icon.classList.remove('opacity-100', 'text-ink-navy', 'translate-x-0');
                    icon.classList.add('opacity-0', 'translate-x-2');
                });

                // Set active (Wait, the design system says: "Selected State: Border thickens to 2px ink-navy." 
                // Since these are rows, a left border or full border box is appropriate. Let's use left border + background for clarity without breaking layout.)
                selectedBtn.classList.remove('border-l-0');
                selectedBtn.classList.add('border-l-4', 'border-l-ink-navy', 'bg-paper-cool');
                
                // Keep icon visible on selected
                const icon = selectedBtn.querySelector('.material-symbols-outlined');
                icon.textContent = 'check'; // Change to checkmark for selection visual feedback
                icon.setAttribute('data-icon', 'check');
                icon.classList.remove('opacity-0', 'translate-x-2');
                icon.classList.add('opacity-100', 'text-ink-navy', 'translate-x-0');
                
                // In a real app, this would trigger validation/next step after a delay
            }

            optionBtns.forEach(btn => {
                btn.addEventListener('click', function() {
                    selectOption(this);
                });
            });
        });
    </script>
