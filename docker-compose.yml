services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: tcf_lab
      POSTGRES_USER: tcf_admin
      POSTGRES_PASSWORD: tcf_local_admin
    ports:
      - "5432:5432"
    volumes:
      - tcf-postgres:/var/lib/postgresql/data
      - ./db/bootstrap.sql:/docker-entrypoint-initdb.d/010-roles.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tcf_admin -d tcf_lab"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  tcf-postgres:
